<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Listens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="spotifyjs.js"></script>


    <h1>What am I listening to right now?</h1>

  
    <div id="dashboard-row"> 
    
        
        <div id="cd-player-box">
            
           
           <!-- The CD Disc Container -->
            <div id="cd">
             <!-- NEW IMAGE TAG: This will hold the spinning album cover -->
            <img id="cd-album-art" src="" alt="Album Art">
    
                <!-- The Center Hole Container -->
                <div id="center-hole"></div>
            </div>

            
            <p id="current-track">Currently playing track: <strong>Take a Walk by Passion Pit</strong></p>
            
        </div> 
    
        <div id="top-tracks">
            <h2>All time favorites</h2>
            
            <ol id="top-tracks-list">
                <li class="track-item"><div class="track-pill">Track 1</div></li>
                <li class="track-item"><div class="track-pill">Track 2</div></li>
                <li class="track-item"><div class="track-pill">Track 3</div></li>
                <li class="track-item"><div class="track-pill">Track 4</div></li>
                <li class="track-item"><div class="track-pill">Track 5</div></li>
            </ol>
        </div> <!-- End of top-tracks -->

    </div> <!-- End of dashboard-row -->
</body>
</html>
