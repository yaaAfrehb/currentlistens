<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Listens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="spotifyjs.js"></script>

    <!-- main content -->
    <h1> What am I listening to right now?</h1>
    <div id="cd-player-box"></div>
    <div id="cd"></div>
            <div id="center-hole"></div>
    <p id="current-track">Currently playing track: <strong>Take a Walk by Passion Pit</strong></p>
    <div id="top-tracks">
        <h2>Top 5 Tracks of the Week</h2>
        
        <ol id="top-tracks-list">
            <li class="track-item">
                <div class="track-pill">Track 1</div>
            </li>
            <li class="track-item">
                <div class="track-pill">Track 2</div>
            </li>
            <li class="track-item">
                <div class="track-pill">Track 3</div>
            </li>
            <li class="track-item">
                <div class="track-pill">Track 4</div>
            </li>
            <li class="track-item">
                <div class="track-pill">Track 5</div>
            </li>
        </ol>
    </div>
</body>
</html>
